<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tetris Sencillo</title>
  <style>
    body {
      background: #1a1a2e;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    canvas {
      border: 3px solid #fff;
      background: #0f0f1a;
    }
    .info {
      margin-bottom: 10px;
      font-size: 20px;
    }
    p {
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="info">Puntos: <span id="score">0</span></div>
  <canvas id="tetris" width="240" height="400"></canvas>
  <p>Controles: Flechas (← → ↓) para mover | Arriba (↑) para rotar</p>

  <script>
     canvas = document.getElementById('tetris');
     ctx = canvas.getContext('2d');
     scoreElement = document.getElementById('score');

    // Escalamos el canvas (12x20 bloques de 20px)
    ctx.scale(20, 20);

    // Colores de las piezas
    const colors = [
      null,
      '#FF0D72', // T
      '#0DC2FF', // I
      '#0DFF72', // S
      '#F538FF', // Z
      '#FF8E0D', // L
      '#FFE138', // O
      '#3877FF'  // J
    ];

    // Definición de las 7 piezas
    function createPiece(type) {
      if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
      if (type === 'I') return [[0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0], [0, 2, 0, 0]];
      if (type === 'S') return [[0, 3, 3], [3, 3, 0], [0, 0, 0]];
      if (type === 'Z') return [[4, 4, 0], [0, 4, 4], [0, 0, 0]];
      if (type === 'L') return [[0, 0, 5], [5, 5, 5], [0, 0, 0]];
      if (type === 'O') return [[6, 6], [6, 6]];
      if (type === 'J') return [[7, 0, 0], [7, 7, 7], [0, 0, 0]];
    }

    // Crear matriz vacía
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    // Dibujar matriz en pantalla
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = colors[value];
            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    // Dibujar todo el juego
    function draw() {
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(arena, { x: 0, y: 0 });
      drawMatrix(player.matrix, player.pos);
    }

    // Detectar colisiones
    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // Fijar pieza en el tablero
    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // Eliminar filas completas y sumar puntos
    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 10;
        rowCount *= 2;
      }
      scoreElement.innerText = player.score;
    }

    // Rotar matriz
    function rotate(matrix) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      matrix.forEach(row => row.reverse());
    }

    // Caída de la pieza
    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    // Movimiento horizontal
    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    // Rotación con ajuste de bordes
    function playerRotate() {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix); // Revertir si no cabe
          player.pos.x = pos;
          return;
        }
      }
    }

    // Nueva pieza aleatoria
    function playerReset() {
      const pieces = 'ILJOTSZ';
      player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      // Si choca al aparecer, reiniciar juego (Game Over)
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        scoreElement.innerText = player.score;
      }
    }

    // Bucle principal del juego
    let dropCounter = 0;
    let dropInterval = 800; // Velocidad de caída (ms)
    let lastTime = 0;

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;

      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    // Controles de teclado
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') playerMove(-1);
      else if (event.key === 'ArrowRight') playerMove(1);
      else if (event.key === 'ArrowDown') playerDrop();
      else if (event.key === 'ArrowUp') playerRotate();
    });

    const arena = createMatrix(12, 20);
    const player = { pos: { x: 0, y: 0 }, matrix: null, score: 0 };

    playerReset();
    update();
  </script>
</body>
</html>
